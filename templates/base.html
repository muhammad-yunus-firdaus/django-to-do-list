{% load static %}
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Manajemen Tugas{% endblock %}</title>
    <meta name="description" content="Aplikasi produktivitas dan manajemen tugas harian yang cepat, aman, dan responsif">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'site.webmanifest' %}">
    <meta name="theme-color" content="#F8FAFC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Manajemen Tugas">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Design System CSS (Shadcn/ui Vanilla Modular) -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=13">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% block head %}{% endblock %}
</head>

<body>

    <!-- Django Messages (Rendered as Sonner-style Toasts via toast.js) -->
    {% if messages %}
    <div id="django-messages" style="display: none;">
        {% for message in messages %}
        <span class="django-message" data-tags="{{ message.tags }}" data-text="{{ message }}"></span>
        {% endfor %}
    </div>
    {% endif %}

    {% block layout %}
    <!-- Layout tanpa sidebar (Login/Register/Auth) -->
    {% block content %}{% endblock %}
    {% endblock layout %}

    <!-- Core Toast System -->
    <script src="{% static 'js/core/toast.js' %}"></script>

    <!-- Core App Scripts -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) lucide.createIcons();
        });

        // Global Time & Date Picker Trigger (Full Box Clickable UX)
        document.addEventListener('click', function(e) {
            const timeOrDateInput = e.target.closest('input[type="time"], input[type="date"], input[type="datetime-local"]');
            if (timeOrDateInput && !timeOrDateInput.disabled && typeof timeOrDateInput.showPicker === 'function') {
                try {
                    timeOrDateInput.showPicker();
                } catch (err) {
                    // Ignore if picker already open or interrupted
                }
            }
        });

        // Global Sidebar Toggle for Mobile
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('open');
        }

        // Global Password Visibility Toggle
        function togglePasswordVisibility(button) {
            const input = button.parentElement.querySelector('input');
            if (!input) return;
            const icon = button.querySelector('[data-lucide]');
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                if (icon) icon.setAttribute('data-lucide', 'eye');
            }
            if (window.lucide) lucide.createIcons();
        }

        // Global Export Dialog Modal (Clean Shadcn Modal)
        function openExportModal(targetDate) {
            const dateParam = targetDate ? '?tanggal=' + targetDate : '';
            
            Swal.fire({
                title: 'Ekspor Data Dokumen',
                html: `
                    <p style="font-size:0.875rem;color:var(--foreground-muted);margin-bottom:1.25rem;text-align:center;">
                        Pilih jenis data dan format berkas yang ingin Anda unduh:
                    </p>
                    <div style="display:flex;flex-direction:column;gap:0.75rem;text-align:left;">
                        <!-- Opsi 1: Jadwal Hari Ini -->
                        <div class="card" style="padding:1rem;">
                            <div style="font-weight:600;font-size:0.875rem;color:var(--foreground);display:flex;align-items:center;gap:0.5rem;">
                                <i data-lucide="calendar" style="width:16px;height:16px;color:var(--foreground);"></i>
                                Jadwal Hari Ini
                            </div>
                            <p style="color:var(--foreground-muted);font-size:0.75rem;margin:0.25rem 0 0.75rem 0;">Agenda kegiatan harian dan target kebiasaan (habit).</p>
                            <div style="display:flex;gap:0.5rem;">
                                <a href="/tugas/agenda/export-pdf/${dateParam}" class="btn btn-sm btn-destructive" onclick="Swal.close()">
                                    <i data-lucide="file-text" style="width:14px;height:14px;"></i> Unduh PDF
                                </a>
                                <a href="/tugas/agenda/export-excel/${dateParam}" class="btn btn-sm btn-secondary" onclick="Swal.close()">
                                    <i data-lucide="sheet" style="width:14px;height:14px;"></i> Unduh Excel
                                </a>
                            </div>
                        </div>
                        
                        <!-- Opsi 2: Daftar Tugas -->
                        <div class="card" style="padding:1rem;">
                            <div style="font-weight:600;font-size:0.875rem;color:var(--foreground);display:flex;align-items:center;gap:0.5rem;">
                                <i data-lucide="check-square" style="width:16px;height:16px;color:var(--foreground);"></i>
                                Seluruh Daftar Tugas
                            </div>
                            <p style="color:var(--foreground-muted);font-size:0.75rem;margin:0.25rem 0 0.75rem 0;">Daftar tugas terstruktur beserta batas waktu dan prioritas.</p>
                            <div style="display:flex;gap:0.5rem;">
                                <a href="/tugas/export/pdf/" class="btn btn-sm btn-destructive" onclick="Swal.close()">
                                    <i data-lucide="file-text" style="width:14px;height:14px;"></i> Unduh PDF
                                </a>
                                <a href="/tugas/export/excel/" class="btn btn-sm btn-secondary" onclick="Swal.close()">
                                    <i data-lucide="sheet" style="width:14px;height:14px;"></i> Unduh Excel
                                </a>
                            </div>
                        </div>

                        <!-- Opsi 3: Kegiatan & Acara -->
                        <div class="card" style="padding:1rem;">
                            <div style="font-weight:600;font-size:0.875rem;color:var(--foreground);display:flex;align-items:center;gap:0.5rem;">
                                <i data-lucide="calendar-days" style="width:16px;height:16px;color:var(--foreground);"></i>
                                Seluruh Kegiatan & Acara
                            </div>
                            <p style="color:var(--foreground-muted);font-size:0.75rem;margin:0.25rem 0 0.75rem 0;">Jadwal acara jangka panjang dan agenda kegiatan mendatang.</p>
                            <div style="display:flex;gap:0.5rem;">
                                <a href="/tugas/export/kegiatan/pdf/" class="btn btn-sm btn-destructive" onclick="Swal.close()">
                                    <i data-lucide="file-text" style="width:14px;height:14px;"></i> Unduh PDF
                                </a>
                                <a href="/tugas/export/kegiatan/excel/" class="btn btn-sm btn-secondary" onclick="Swal.close()">
                                    <i data-lucide="sheet" style="width:14px;height:14px;"></i> Unduh Excel
                                </a>
                            </div>
                        </div>
                    </div>
                `,
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: 'Tutup',
                customClass: {
                    popup: 'swal-custom-modal'
                },
                didOpen: () => {
                    if (window.lucide) lucide.createIcons();
                }
            });
        }

        // Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(reg => console.debug('SW registered:', reg.scope))
                    .catch(err => console.debug('SW failed:', err));
            });
        }
    </script>

    <!-- Notification System -->
    <script>
        window.CSRF_TOKEN = '{{ csrf_token }}';
    </script>
    <script src="{% static 'js/notifications.js' %}"></script>

    <!-- Productivity Modules: Focus Timer & Command Palette -->
    <script src="{% static 'js/core/pomodoro.js' %}?v=3"></script>
    <script src="{% static 'js/core/command-palette.js' %}"></script>

    {% block scripts %}{% endblock %}

    <!-- Instant Page Prefetch -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/instant.page/5.2.0/instantpage.min.js" type="module" integrity="sha512-1+qUtKoh9XZW7j+6LhRAnDJENBUfjyUuGIsFs/zS9ORGAI3X32A3Xed0Eh64E3FB1hnqgEQb+tNtO53V3dDT9Q==" crossorigin="anonymous"></script>
</body>

</html>
