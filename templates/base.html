{% load static %}
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Manajemen Tugas{% endblock %}</title>
    <meta name="description" content="Kelola tugas dengan mudah dan efisien">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'site.webmanifest' %}">
    <meta name="theme-color" content="#000000">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tugas App">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Design System CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% block head %}{% endblock %}
</head>

<body>

    {% block layout %}
    <!-- Default layout: full page without sidebar (used by login/register) -->
    {% if messages %}
    <div style="position:fixed;top:16px;right:16px;z-index:100;max-width:400px;">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
    {% endblock layout %}

    <!-- Lucide Icons Init -->
    <script>
        document.addEventListener("DOMContentLoaded", () => lucide.createIcons());

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        // Global Password Visibility Toggle
        function togglePasswordVisibility(button) {
            const input = button.parentElement.querySelector('input');
            if (!input) return;
            const icon = button.querySelector('[data-lucide]');
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) {
                    icon.setAttribute('data-lucide', 'eye-off');
                    if (window.lucide) lucide.createIcons();
                }
            } else {
                input.type = 'password';
                if (icon) {
                    icon.setAttribute('data-lucide', 'eye');
                    if (window.lucide) lucide.createIcons();
                }
            }
        }

        // Global Export Dialog Modal
        // Global Export Dialog Modal
        function openExportModal(targetDate) {
            const dateParam = targetDate ? '?tanggal=' + targetDate : '';
            
            Swal.fire({
                title: 'Ekspor Data Aplikasi',
                html: `
                    <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:18px;text-align:center;">
                        Pilih kategori data dan format dokumen yang ingin Anda unduh:
                    </p>
                    <div style="display:flex;flex-direction:column;gap:12px;text-align:left;">
                        <!-- Opsi 1: Jadwal Hari Ini -->
                        <div style="border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg-secondary);">
                            <div style="font-weight:600;font-size:0.9rem;color:var(--text-primary);display:flex;align-items:center;gap:8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);flex-shrink:0;"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                                Jadwal Hari Ini
                            </div>
                            <p class="text-xs" style="color:var(--text-muted);margin:4px 0 10px 0;">Mengunduh agenda harian & habit tracker hari ini.</p>
                            <div style="display:flex;gap:8px;">
                                <a href="/tugas/agenda/export-pdf/${dateParam}" class="btn btn-sm" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#EF4444;border:none;color:white;padding:8px 12px;border-radius:6px;font-size:0.8rem;font-weight:600;transition:all 0.2s;" onmouseover="this.style.opacity=0.9" onmouseout="this.style.opacity=1" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                                    Unduh PDF
                                </a>
                                <a href="/tugas/agenda/export-excel/${dateParam}" class="btn btn-sm" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#10B981;border:none;color:white;padding:8px 12px;border-radius:6px;font-size:0.8rem;font-weight:600;transition:all 0.2s;" onmouseover="this.style.opacity=0.9" onmouseout="this.style.opacity=1" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 18h12"/><path d="M12 9v9"/><path d="M16 12h-8"/></svg>
                                    Unduh Excel
                                </a>
                            </div>
                        </div>
                        
                        <!-- Opsi 2: Daftar Tugas -->
                        <div style="border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg-secondary);">
                            <div style="font-weight:600;font-size:0.9rem;color:var(--text-primary);display:flex;align-items:center;gap:8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);flex-shrink:0;"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/><rect x="3" y="11" width="6" height="6" rx="1"/></svg>
                                Seluruh Daftar Tugas
                            </div>
                            <p class="text-xs" style="color:var(--text-muted);margin:4px 0 10px 0;">Mengunduh berkas lengkap daftar tugas dan statusnya.</p>
                            <div style="display:flex;flex-wrap:wrap;gap:8px;">
                                <a href="/tugas/export/pdf/" class="btn btn-sm" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#EF4444;border:none;color:white;padding:8px 12px;border-radius:6px;font-size:0.8rem;font-weight:600;transition:all 0.2s;" onmouseover="this.style.opacity=0.9" onmouseout="this.style.opacity=1" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                                    Unduh PDF
                                </a>
                                <a href="/tugas/export/excel/" class="btn btn-sm" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#10B981;border:none;color:white;padding:8px 12px;border-radius:6px;font-size:0.8rem;font-weight:600;transition:all 0.2s;" onmouseover="this.style.opacity=0.9" onmouseout="this.style.opacity=1" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 18h12"/><path d="M12 9v9"/><path d="M16 12h-8"/></svg>
                                    Unduh Excel
                                </a>
                            </div>
                        </div>

                        <!-- Opsi 3: Kegiatan & Acara -->
                        <div style="border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg-secondary);">
                            <div style="font-weight:600;font-size:0.9rem;color:var(--text-primary);display:flex;align-items:center;gap:8px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);flex-shrink:0;"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
                                Seluruh Kegiatan & Acara
                            </div>
                            <p class="text-xs" style="color:var(--text-muted);margin:4px 0 10px 0;">Mengunduh berkas lengkap agenda kegiatan & acara terjadwal.</p>
                            <div style="display:flex;flex-wrap:wrap;gap:8px;">
                                <a href="/tugas/export/kegiatan/pdf/" class="btn btn-sm" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#EF4444;border:none;color:white;padding:8px 12px;border-radius:6px;font-size:0.8rem;font-weight:600;transition:all 0.2s;" onmouseover="this.style.opacity=0.9" onmouseout="this.style.opacity=1" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                                    Unduh PDF
                                </a>
                                <a href="/tugas/export/kegiatan/excel/" class="btn btn-sm" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:#10B981;border:none;color:white;padding:8px 12px;border-radius:6px;font-size:0.8rem;font-weight:600;transition:all 0.2s;" onmouseover="this.style.opacity=0.9" onmouseout="this.style.opacity=1" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 18h12"/><path d="M12 9v9"/><path d="M16 12h-8"/></svg>
                                    Unduh Excel
                                </a>
                            </div>
                        </div>
                    </div>
                `,
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: 'Batal',
                cancelButtonColor: 'var(--border)',
                customClass: {
                    popup: 'swal-export-custom'
                }
            });
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }
    </script>

    <!-- Notification System -->
    <script>
        // Set CSRF token from Django template for AJAX requests
        window.CSRF_TOKEN = '{{ csrf_token }}';
    </script>
    <script src="{% static 'js/notifications.js' %}"></script>

    {% block scripts %}{% endblock %}

    <!-- Instant Page Prefetch -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/instant.page/5.2.0/instantpage.min.js" type="module" integrity="sha512-1+qUtKoh9XZW7j+6LhRAnDJENBUfjyUuGIsFs/zS9ORGAI3X32A3Xed0Eh64E3FB1hnqgEQb+tNtO53V3dDT9Q==" crossorigin="anonymous"></script>
</body>

</html>
