{% load static %}
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Manajemen Tugas{% endblock %}</title>
    <meta name="description" content="Kelola tugas dengan mudah dan efisien">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'site.webmanifest' %}">
    <meta name="theme-color" content="#4F46E5">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tugas App">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Design System CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% block head %}{% endblock %}
</head>

<body>

    {% block layout %}
    <!-- Default layout: full page without sidebar (used by login/register) -->
    {% if messages %}
    <div style="position:fixed;top:16px;right:16px;z-index:100;max-width:400px;">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
    {% endblock layout %}

    <!-- Lucide Icons Init -->
    <script>
        document.addEventListener("DOMContentLoaded", () => lucide.createIcons());

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }

        // Global Password Visibility Toggle
        function togglePasswordVisibility(button) {
            const input = button.parentElement.querySelector('input');
            if (!input) return;
            const icon = button.querySelector('[data-lucide]');
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) {
                    icon.setAttribute('data-lucide', 'eye-off');
                    if (window.lucide) lucide.createIcons();
                }
            } else {
                input.type = 'password';
                if (icon) {
                    icon.setAttribute('data-lucide', 'eye');
                    if (window.lucide) lucide.createIcons();
                }
            }
        }

        // Global Export Dialog Modal
        function openExportModal(targetDate) {
            const dateParam = targetDate ? '?tanggal=' + targetDate : '';
            
            Swal.fire({
                title: 'Ekspor Data Aplikasi',
                width: '800px',
                html: `
                    <style>
                        .swal-export-container {
                            display: grid;
                            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                            gap: 16px;
                            margin-top: 15px;
                            text-align: left;
                        }
                        .swal-export-card {
                            background: var(--card, #ffffff);
                            border: 1px solid var(--border, #e2e8f0);
                            border-radius: 12px;
                            padding: 20px;
                            display: flex;
                            flex-direction: column;
                            justify-content: space-between;
                            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
                            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                        }
                        .swal-export-card:hover {
                            transform: translateY(-4px);
                            box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
                            border-color: var(--primary, #4f46e5);
                        }
                        .swal-export-header {
                            display: flex;
                            align-items: center;
                            gap: 10px;
                            margin-bottom: 12px;
                        }
                        .swal-export-icon-box {
                            width: 36px;
                            height: 36px;
                            border-radius: 8px;
                            background: var(--primary-light, #e0e7ff);
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            color: var(--primary, #4f46e5);
                            flex-shrink: 0;
                        }
                        .swal-export-title {
                            font-weight: 700;
                            font-size: 0.95rem;
                            color: var(--text-primary, #1e293b);
                            margin: 0;
                        }
                        .swal-export-desc {
                            font-size: 0.775rem;
                            color: var(--text-muted, #64748b);
                            margin: 0 0 20px 0;
                            line-height: 1.4;
                        }
                        .swal-export-actions {
                            display: flex;
                            gap: 8px;
                            margin-top: auto;
                        }
                        .swal-export-btn {
                            flex: 1;
                            text-decoration: none;
                            display: inline-flex;
                            align-items: center;
                            justify-content: center;
                            gap: 6px;
                            padding: 10px 12px;
                            border-radius: 8px;
                            font-size: 0.775rem;
                            font-weight: 600;
                            color: white;
                            transition: all 0.2s;
                            border: none;
                            cursor: pointer;
                        }
                        .swal-export-btn:hover {
                            opacity: 0.9;
                            transform: translateY(-1px);
                        }
                        .swal-export-btn-pdf {
                            background: linear-gradient(135deg, #EF4444, #F87171);
                        }
                        .swal-export-btn-excel {
                            background: linear-gradient(135deg, #10B981, #34D399);
                        }
                    </style>

                    <p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:20px;text-align:center;">
                        Pilih kategori data dan format dokumen yang ingin Anda unduh secara instan:
                    </p>
                    
                    <div class="swal-export-container">
                        <!-- Card 1: Jadwal Hari Ini -->
                        <div class="swal-export-card">
                            <div>
                                <div class="swal-export-header">
                                    <div class="swal-export-icon-box">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                                    </div>
                                    <h4 class="swal-export-title">Jadwal Hari Ini</h4>
                                </div>
                                <p class="swal-export-desc">Mengunduh daftar agenda, aktivitas harian, serta habit tracker hari ini.</p>
                            </div>
                            <div class="swal-export-actions">
                                <a href="/tugas/agenda/export-pdf/${dateParam}" class="swal-export-btn swal-export-btn-pdf" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                                    PDF
                                </a>
                                <a href="/tugas/agenda/export-excel/${dateParam}" class="swal-export-btn swal-export-btn-excel" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 18h12"/><path d="M12 9v9"/><path d="M16 12h-8"/></svg>
                                    Excel
                                </a>
                            </div>
                        </div>

                        <!-- Card 2: Daftar Tugas -->
                        <div class="swal-export-card">
                            <div>
                                <div class="swal-export-header">
                                    <div class="swal-export-icon-box" style="background:#e0f2fe;color:#0284c7;">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/><rect x="3" y="11" width="6" height="6" rx="1"/></svg>
                                    </div>
                                    <h4 class="swal-export-title">Daftar Tugas</h4>
                                </div>
                                <p class="swal-export-desc">Mengunduh seluruh daftar tugas beserta deskripsi, status, dan prioritasnya.</p>
                            </div>
                            <div class="swal-export-actions">
                                <a href="/tugas/export/pdf/" class="swal-export-btn swal-export-btn-pdf" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                                    PDF
                                </a>
                                <a href="/tugas/export/excel/" class="swal-export-btn swal-export-btn-excel" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 18h12"/><path d="M12 9v9"/><path d="M16 12h-8"/></svg>
                                    Excel
                                </a>
                            </div>
                        </div>

                        <!-- Card 3: Kegiatan & Acara -->
                        <div class="swal-export-card">
                            <div>
                                <div class="swal-export-header">
                                    <div class="swal-export-icon-box" style="background:#fef3c7;color:#d97706;">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
                                    </div>
                                    <h4 class="swal-export-title">Kegiatan & Acara</h4>
                                </div>
                                <p class="swal-export-desc">Mengunduh seluruh agenda kegiatan luar, acara sosial, dan acara pribadi.</p>
                            </div>
                            <div class="swal-export-actions">
                                <a href="/tugas/export/kegiatan/pdf/" class="swal-export-btn swal-export-btn-pdf" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                                    PDF
                                </a>
                                <a href="/tugas/export/kegiatan/excel/" class="swal-export-btn swal-export-btn-excel" onclick="Swal.close()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 18h12"/><path d="M12 9v9"/><path d="M16 12h-8"/></svg>
                                    Excel
                                </a>
                            </div>
                        </div>
                    </div>
                `,
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: 'Batal',
                cancelButtonColor: 'var(--border)',
                customClass: {
                    popup: 'swal-export-modern-popup'
                }
            });
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }
    </script>

    <!-- Notification System -->
    <script>
        // Set CSRF token from Django template for AJAX requests
        window.CSRF_TOKEN = '{{ csrf_token }}';
    </script>
    <script src="{% static 'js/notifications.js' %}"></script>

    {% block scripts %}{% endblock %}

    <!-- Instant Page Prefetch -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/instant.page/5.2.0/instantpage.min.js" type="module" integrity="sha512-1+qUtKoh9XZW7j+6LhRAnDJENBUfjyUuGIsFs/zS9ORGAI3X32A3Xed0Eh64E3FB1hnqgEQb+tNtO53V3dDT9Q==" crossorigin="anonymous"></script>
</body>

</html>
